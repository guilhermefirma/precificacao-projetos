<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Proposta comercial FIRMA</title>
<link rel="icon" href="../firma.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#0a0a0a;--ink2:#3d3d3d;--muted:#6e6e6e;--line:#e6e6e6;--line2:#d2d2d2;--surface:#f5f5f4;--bg:#fff;--ok:#17663f;--okbg:#e2f2e9}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55}
.wrap{max-width:920px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.bar img{height:34px;width:auto}
.bar .t{font-size:12px;color:var(--muted);line-height:1.3}.bar .t b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.bar .r{margin-left:auto;display:flex;gap:8px}
.btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:999px;padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn.g{background:var(--bg);color:var(--ink);border-color:var(--line2)}.btn.g:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.cover{padding:64px 0 40px;border-bottom:1px solid var(--line)}
.eb{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(34px,6vw,52px);line-height:1.04;letter-spacing:-.03em;font-weight:600;margin:14px 0 10px;text-wrap:balance}
.att{color:var(--ink2);font-size:16px;margin:0}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:36px;border-top:1px solid var(--line)}
.meta div{padding:14px 16px 0 0}.meta span{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.meta b{font-weight:600;font-size:14px}
section{padding:48px 0;border-bottom:1px solid var(--line)}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.sh .n{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:22px;letter-spacing:-.02em;font-weight:600;margin:0}
.inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.inv .c{border-radius:18px;padding:22px 24px;background:var(--ink);color:#fff}
.inv .c.s{background:var(--surface);color:var(--ink)}
.inv small{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.inv b{display:block;font-size:clamp(28px,4.5vw,36px);letter-spacing:-.03em;font-weight:600;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.inv span{font-size:13px;opacity:.65}
.ref{margin-top:14px;font-size:13.5px;color:var(--ink2);display:flex;gap:6px 18px;flex-wrap:wrap}
.ref b{font-weight:600;color:var(--ok)}
.fr{margin-top:26px}.fr:first-child{margin-top:0}
.fr h3{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.ln{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.ln .i{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.ln b{font-weight:600}.ln p{margin:3px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.ln .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .v small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.tots{margin-top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tots div{display:flex;gap:18px;align-items:baseline;font-variant-numeric:tabular-nums}.tots span{color:var(--muted);font-size:14px}.tots b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.cd{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0}
.cd b,.cd span{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.cd b{font-weight:600}.cd span{color:var(--ink2)}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.sig>div{border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.sig small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sig .n{height:62px;display:flex;align-items:flex-end;margin-top:6px;border-bottom:1px solid var(--ink);padding-bottom:4px;font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:28px;line-height:1}
.sig .n img{max-height:56px;max-width:100%}
.sig .nm{font-weight:600;font-size:14px;margin-top:10px}.sig p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}label .o{font-weight:400;color:var(--muted)}
input[type=text],input[type=email]{font:inherit;font-size:16px;font-weight:400;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none;background:#fff}
input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,10,10,.07)}
.full{grid-column:1/-1}
.chk{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:14px;line-height:1.5;color:var(--ink2)}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:#0a0a0a;flex:none}
#go{font-size:15px;padding:15px 22px;justify-content:center}
.err{color:#a3231b;font-size:13.5px;min-height:1em}
.legal{font-size:12px;color:var(--muted);line-height:1.55;margin:18px 0 0}
.done{border-radius:16px;background:var(--okbg);color:var(--ok);padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.done .ck{width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;font-size:15px}
.done b{display:block;font-size:16px}.done span{color:var(--ink2);font-size:14px}
.warn{border-radius:16px;background:var(--surface);padding:18px 20px;color:var(--ink2)}
.msg{padding:120px 0;text-align:center}.msg h1{font-size:28px}.msg p{color:var(--muted)}
footer{padding:28px 0 60px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:inherit}
@media (max-width:720px){
  .bar .t{display:none}.bar .r .g{display:none}
  .cover{padding:40px 0 28px}.meta{grid-template-columns:1fr 1fr}.meta div{padding:12px 12px 0 0}
  section{padding:36px 0}
  .sig{grid-template-columns:1fr}form{grid-template-columns:1fr}.cd{grid-template-columns:1fr}.cd b{border:0;padding-bottom:0}.cd span{padding-top:4px}
  .ln{grid-template-columns:22px minmax(0,1fr)}.ln .v{grid-column:2;text-align:left}.ln .v small{display:inline;margin-left:6px}
}
@media print{
  .bar,form,.noprint{display:none!important}
  body{font-size:12px}.cover{padding:10px 0 20px}section{padding:22px 0;break-inside:avoid-page}.ln{break-inside:avoid}
  .inv .c{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:16mm}
}
</style>
</head>
<body>
<div id="app"><div class="wrap msg"><p>Carregando a proposta…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = 'https://cahgrygzwfufukijwjks.supabase.co', SB_KEY = 'sb_publishable_BvUbGFJpR1j2jz05-B54qA_P2OO0WJo';
const $ = id => document.getElementById(id), app = $('app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = n => (+n||0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const dBR = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '';
const dtBR = iso => { try { return new Date(iso).toLocaleString('pt-BR', {timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}).replace(',', ' às'); } catch(_) { return ''; } };
const today = () => new Date().toLocaleDateString('sv-SE', {timeZone: 'America/Sao_Paulo'});
const token = new URLSearchParams(location.search).get('t') || '';
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: false, autoRefreshToken: false}}) : null;
const fixName = n => n === 'Vitor Horvat' ? 'Vitor Horvath' : n;
let D = null, ACC = null;
const foot = () => `<footer class="wrap"><span>FIRMA · <a href="https://agenciafirma.com.br" target="_blank" rel="noopener">agenciafirma.com.br</a> · CNPJ 20.431.153/0001-09</span><span>Documento confidencial, destinado ao cliente indicado.</span></footer>`;
const msg = (h, p) => { app.innerHTML = `<div class="wrap msg"><h1>${esc(h)}</h1><p>${esc(p)}</p></div>${foot()}`; };

function page(){
  const d = D, sg = d.signer || {}, sgn = fixName(sg.name || ''), company = d.company || d.client || '', att = d.company ? [d.person, d.role].filter(Boolean).join(', ') : [d.project, d.contact].filter(Boolean).join(' · ');
  const expired = d.validUntil && d.validUntil < today() && !ACC;
  let n = 0;
  const inv = (d.mensal ? `<div class="c"><small>Investimento mensal</small><b>${BRL(d.mensal)}</b><span>por mês</span></div>` : '') + (d.unico ? `<div class="c${d.mensal ? ' s' : ''}"><small>Projetos e entregas únicas</small><b>${BRL(d.unico)}</b><span>valor único</span></div>` : '');
  const ref = d.ref && d.ref.tabela > 0 ? (() => { const base = d.ref.mensal ? d.mensal : d.unico, pct = Math.round((1 - base/d.ref.tabela)*100);
    return `<div class="ref"><span>Valor de mercado (tabela Sinapro): ${BRL(d.ref.tabela)}${d.ref.mensal ? '/mês' : ''}</span><span>Condição FIRMA: <b>${pct}% abaixo do mercado</b></span></div>`; })() : '';
  const scope = (d.fronts || []).map(f => `<div class="fr"><h3>${esc(f.name)}</h3>${f.lines.map(l => `<div class="ln"><span class="i">${String(++n).padStart(2, '0')}</span><div><b>${esc(l.name)}</b>${l.desc ? `<p>${esc(l.desc)}</p>` : ''}</div><div class="v">${BRL(l.price)}${l.rec === 'mensal' ? '/mês' : ''}<small>${esc(l.q)}</small></div></div>`).join('')}</div>`).join('');
  const tots = (d.mensal ? `<div><span>Investimento mensal</span><b>${BRL(d.mensal)}/mês</b></div>` : '') + (d.unico ? `<div><span>Projetos e entregas únicas</span><b>${BRL(d.unico)}</b></div>` : '');
  const cond = (d.cond || []).map(([l, v]) => `<b>${esc(l)}</b><span>${esc(v)}</span>`).join('');
  const firma = `<div><small>Pela FIRMA</small><div class="n">${sg.img ? `<img src="${sg.img}" alt="Assinatura de ${esc(sgn)}">` : esc(sgn)}</div><div class="nm">${esc([sgn, sg.role].filter(Boolean).join(', ') || 'FIRMA')}</div><p>FIRMA · CNPJ 20.431.153/0001-09</p><p>Assinado eletronicamente em ${esc(dBR(d.date))}</p></div>`;
  const cli = ACC ? `<div><small>Pelo cliente</small><div class="n">${esc(ACC.name)}</div><div class="nm">${esc([ACC.name, ACC.role].filter(Boolean).join(', '))}</div><p>${esc([company, ACC.doc].filter(Boolean).join(' · '))}</p><p>Aceite formalizado em ${esc(dtBR(ACC.at))}</p></div>`
    : `<div><small>Pelo cliente</small><div class="n" id="pv"></div><div class="nm">${esc(company)}</div><p>A assinatura aparece aqui ao formalizar o aceite.</p></div>`;
  const form = ACC ? `<div class="done"><span class="ck">✓</span><div><b>Aceite formalizado</b><span>Obrigado, ${esc(ACC.name.split(' ')[0])}. A FIRMA já recebeu o aceite e entra em contato para o início do projeto.</span></div></div>`
    : expired ? `<div class="warn"><b>Esta proposta venceu em ${esc(dBR(d.validUntil))}.</b> Fale com a FIRMA para receber uma versão atualizada.</div>`
    : `<form id="f" novalidate>
        <label>Nome completo<input type="text" name="name" autocomplete="name" required value="${esc(d.person || '')}"></label>
        <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
        <label><span>CPF ou CNPJ <span class="o">(opcional)</span></span><input type="text" name="doc" inputmode="numeric"></label>
        <label><span>Cargo <span class="o">(opcional)</span></span><input type="text" name="role" autocomplete="organization-title" value="${esc(d.role || '')}"></label>
        <label class="chk full"><input type="checkbox" name="ok"><span>Li e aprovo a proposta ${esc(d.number)} para ${esc(company)}, com o escopo, os valores e as condições acima, e autorizo o início do projeto.</span></label>
        <div class="err full" id="err"></div>
        <button class="btn full" id="go" type="submit">Formalizar aceite</button>
      </form>`;
  const pre = sgn ? sgn + ', FIRMA' : 'FIRMA';
  app.innerHTML = `<div class="bar"><div class="wrap"><img src="../firma.png" alt="FIRMA"><div class="t"><b>Proposta comercial</b>${esc(d.number)}</div>
      <div class="r"><button class="btn g" id="pdf" type="button">Salvar em PDF</button>${ACC || expired ? '' : '<a class="btn" href="#aceite">Formalizar aceite</a>'}</div></div></div>
    <div class="wrap">
      <div class="cover"><div class="eb">Proposta comercial ${esc(d.number)}</div><h1>${esc(company)}</h1>${att ? `<p class="att">A/C ${esc(att)}</p>` : ''}
        <div class="meta"><div><span>Emitida em</span><b>${esc(dBR(d.date))}</b></div><div><span>Válida até</span><b>${esc(dBR(d.validUntil)) || 'Sob consulta'}</b></div><div><span>Preparada por</span><b>${esc(pre)}</b></div><div><span>Status</span><b>${ACC ? 'Aceite formalizado' : expired ? 'Vencida' : 'Aguardando aceite'}</b></div></div></div>
      <section><div class="sh"><span class="n">01</span><h2>Investimento</h2></div><div class="inv">${inv}</div>${ref}</section>
      <section><div class="sh"><span class="n">02</span><h2>Escopo</h2></div>${scope}<div class="tots">${tots}</div></section>
      ${cond ? `<section><div class="sh"><span class="n">03</span><h2>Condições</h2></div><div class="cd">${cond}</div></section>` : ''}
      <section id="aceite" style="border-bottom:0"><div class="sh"><span class="n">${cond ? '04' : '03'}</span><h2>${ACC ? 'Aceite formalizado' : 'Formalizar aceite'}</h2></div>
        <div class="sig">${firma}${cli}</div>${form}
        <p class="legal">Aceite eletrônico com registro de data, hora, IP e identificação do signatário, nos termos da MP 2.200-2/2001, art. 10, § 2º, e da Lei 14.063/2020. Se preferir, a FIRMA envia esta proposta para assinatura digital via ClickSign.</p></section>
    </div>${foot()}`;
  $('pdf').addEventListener('click', () => window.print());
  const f = $('f'); if (!f) return;
  const pv = () => { $('pv').textContent = f.elements.name.value; }; pv(); f.elements.name.addEventListener('input', pv);
  f.addEventListener('submit', async e => { e.preventDefault(); const g = k => f.elements[k].value.trim();
    const name = g('name'), email = g('email');
    if (name.split(/\s+/).length < 2) { $('err').textContent = 'Informe nome e sobrenome.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('err').textContent = 'Informe um e-mail válido.'; return; }
    if (!f.elements.ok.checked) { $('err').textContent = 'Marque a caixa de aceite para continuar.'; return; }
    $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Registrando aceite…';
    try { const {data, error} = await sb.rpc('share_accept', {t: token, nome: name, email, doc: g('doc'), cargo: g('role')}); if (error) throw error;
      ACC = data; page(); $('aceite').scrollIntoView({behavior: 'smooth', block: 'start'}); }
    catch(err) { console.error(err); const m = String(err.message || '');
      $('err').textContent = m.includes('expired') ? 'Esta proposta venceu. Fale com a FIRMA.' : 'Não foi possível registrar agora. Tente de novo em instantes.';
      $('go').disabled = false; $('go').textContent = 'Formalizar aceite'; } });
}

(async () => {
  if (!token || !/^[a-f0-9]{24,64}$/.test(token)) { msg('Link inválido', 'Confira o link recebido da FIRMA.'); return; }
  if (!sb) { msg('Não foi possível carregar', 'Recarregue a página.'); return; }
  try { const {data, error} = await sb.rpc('share_get', {t: token}); if (error) throw error;
    if (!data || !data.data) { msg('Proposta não encontrada', 'Confira o link recebido da FIRMA.'); return; }
    D = data.data; ACC = data.accepted || null; document.title = 'Proposta FIRMA · ' + (D.company || D.client); page(); }
  catch(e) { console.error(e); msg('Não foi possível carregar', 'Recarregue a página em instantes.'); }
})();
</script>
</body>
</html>
